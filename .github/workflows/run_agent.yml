# =========================================================================
# 🛡️ FLOP LABS HYPER-HUMANOID AGENT RUNNER - PRODUCTION WORKFLOW
# =========================================================================

name: Run Official Flop Stealth Agent

# إعدادات إطلاق وتشغيل العميل تلقائياً
on:
  # يتيح لك تشغيل العميل يدوياً في أي وقت بضغطة زر من واجهة GitHub
  workflow_dispatch:
  
  # جدولة تشغيل تلقائية (مثال: يتم تشغيله تلقائياً كل ساعتين على مدار اليوم)
  schedule:
    - cron: '0 */2 * * *'

jobs:
  start-agent:
    name: start-agent
    runs-on: ubuntu-latest

    steps:
      - name: ⚙️ Set up job
        run: echo "Initializing stealth ecosystem..."

      # التحديث: استخدام v4 لمنع التنبيهات وللتوافق الكامل مع المنصة
      - name: 📁 Checkout Repository Code
        uses: actions/checkout@v4

      # التحديث: تحديث الـ Action إلى v4 واعتماد بيئة Node.js حديثة ومستقرة
      - name: 🧠 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22' # تم التحديث إلى إصدار مستقر ومدعوم بالكامل لمنع الـ Warning
          cache: 'npm'

      - name: 📦 Install Network Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json found, generating lightweight dependencies..."
            npm init -y
            npm install crypto
          fi

      # تنفيذ السكربت الذكي الذي قمنا بتنظيفه وحمايته سابقاً
      - name: 🚀 Execute Stealth Core Cycle
        env:
          # تمرير مفاتيحك السرية بأمان تام دون كتابتها علناً في الكود
          NODE_MY_DID: ${{ secrets.NODE_MY_DID }}
          MY_SECRET_SEED: ${{ secrets.MY_SECRET_SEED }}
        run: |
          if [ -f index.js ]; then
            node index.js
          elif [ -f agent.js ]; then
            node agent.js
          else
            echo "Error: Main script file not found! Please ensure your JavaScript file is named index.js or agent.js"
            exit 1
          fi

      - name: 🧹 Post Setup Node.js Environment
        run: echo "Cleaning up runtime temporary buffers..."

      - name: 🔒 Post Checkout Repository Code
        run: echo "Securing cryptographic session tracks..."

      - name: ✨ Complete job
        run: echo "Stealth cycle executed and synchronized successfully."

name: Run Official Flop Stealth Agent

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  start-agent:
    runs-on: ubuntu-latest

    steps:
      # سحب الكود بإصدار ممتثل لبيئة جيت هاب الجديدة
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # بيئة النود الافتراضية للـ Action
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4

      # كود التثبيت القديم والخاص بك تماماً كما كان
      - name: Install Network Dependencies
        run: npm ci

      # كود التشغيل القديم والخاص بك تماماً كما كان
      - name: Execute Stealth Core Cycle
        run: npm start

name: Execute Stealth Core Cycle

on:
  push:
    branches:
      - main
  workflow_dispatch: # يتيح لك زر التشغيل اليدوي (Run workflow) من صفحة Actions بأي وقت

jobs:
  start-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Network Dependencies
        run: npm install

      - name: Execute Stealth Core Cycle
        run: node index.js

name: Execute Stealth Core Cycle

on:
  schedule:
    - cron: '0 */4 * * *' # يستيقظ تلقائياً كل 4 ساعات لتشغيل معاملة بشرية عشوائية
  workflow_dispatch: # يترك لك زر التشغيل اليدوي متاحاً بأي وقت

jobs:
  start-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v3

      - name: Setup Node.js Environment
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: Install Network Dependencies
        run: npm install

      - name: Execute Stealth Core Cycle
        run: node index.js

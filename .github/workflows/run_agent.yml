name: Run Official Flop Stealth Agent

on:
  # 1. تشغيل تلقائي مجدول (كل 12 ساعة)
  schedule:
    - cron: '0 */12 * * *'

  # 2. الاحتفاظ بميزة التشغيل اليدوي
  workflow_dispatch:

jobs:
  run-stealth-agent:
    runs-on: ubuntu-latest

    steps:
      # الخطوة الأولى: جلب ملفات المستودع
      - name: Checkout Repository
        uses: actions/checkout@v4

      # الخطوة الثانية: إعداد بيئة تشغيل Node.js وترقيتها إلى الإصدار 24
      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # الخطوة الثالثة: تثبيت حزم الاعتماديات بشكل مباشر
      - name: Install Dependencies
        run: npm install

      # الخطوة الرابعة: تشغيل عميل الفحص ومزامنة البيانات
      - name: Execute Flop Inference Cluster Agent
        env:
          FLOP_TOKEN: ${{ secrets.FLOP_TOKEN }}
        run: node index.js

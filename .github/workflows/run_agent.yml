# =========================================================================
# 🛡️ FLOP LABS HYPER-HUMANOID AGENT RUNNER - PRODUCTION WORKFLOW (FIXED)
# =========================================================================

name: Run Official Flop Stealth Agent

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */2 * * *'

jobs:
  start-agent:
    name: start-agent
    runs-on: ubuntu-latest

    steps:
      - name: ⚙️ Set up job
        run: echo "Initializing stealth ecosystem..."

      - name: 📁 Checkout Repository Code
        uses: actions/checkout@v4

      # تم إصلاح الخطأ هنا عبر إزالة خاصية الكاش (cache) لمنع تعطل المهمة عند غياب ملف القفل
      - name: 🧠 Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 📦 Install Network Dependencies
        run: |
          if [ -f package.json ]; then
            npm install
          else
            echo "No package.json found, generating lightweight dependencies..."
            npm init -y
            npm install crypto
          fi

      - name: 🚀 Execute Stealth Core Cycle
        env:
          NODE_MY_DID: ${{ secrets.NODE_MY_DID }}
          MY_SECRET_SEED: ${{ secrets.MY_SECRET_SEED }}
        run: |
          if [ -f index.js ]; then
            node index.js
          elif [ -f agent.js ]; then
            node agent.js
          else
            echo "Error: Main script file not found! Please ensure your JavaScript file is named index.js or agent.js"
            exit 1
          fi

      - name: 🧹 Post Setup Node.js Environment
        run: echo "Cleaning up runtime temporary buffers..."

      - name: 🔒 Post Checkout Repository Code
        run: echo "Securing cryptographic session tracks..."

      - name: ✨ Complete job
        run: echo "Stealth cycle executed and synchronized successfully."

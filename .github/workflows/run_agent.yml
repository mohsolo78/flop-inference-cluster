name: Run Official Flop Stealth Agent

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  start-agent:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # قمنا بإزالة سطر cache: 'npm' لحل مشكلة الـ lock file المفقود نهائياً

      - name: Install Network Dependencies
        # تم تغيير npm ci إلى npm install لأن npm ci تشترط أيضاً وجود package-lock.json
        run: npm install

      - name: Execute Stealth Core Cycle
        run: npm start
